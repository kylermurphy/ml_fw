[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbed-input"
version = "0.1.0"
description = "Residual-based perturbation ensemble tools for time series."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "pmdarima",
    "scipy",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perturbed_input*"]